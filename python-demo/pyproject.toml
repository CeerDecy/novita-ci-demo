[project]
name = "calc"
version = "0.1.0"
description = "Tiny calculator demo used to exercise CI."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
